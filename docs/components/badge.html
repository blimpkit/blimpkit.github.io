<h1>Badge</h1>
<p>Badges are used to indicate a notification, item count, or other information relating to a given component.</p>

<h2>Examples</h2>

<code-block>
  <div class="bk-padding bk-border" style="position: relative">
    <bk-badge>Badge</bk-badge>
    <span>Some information</span>
  </div>
</code-block>
